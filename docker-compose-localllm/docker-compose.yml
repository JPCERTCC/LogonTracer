services:
  neo4j:
    container_name: neo4j
    image: neo4j:5.26.19-enterprise
    ports:
      - "0.0.0.0:7474:7474"
      - "0.0.0.0:7687:7687"
    environment:
      - NEO4J_dbms_default__database=neo4j
      - NEO4J_dbms_connector_bolt_listen__address=0.0.0.0:7687
      - NEO4J_dbms_connector_http_listen__address=0.0.0.0:7474
      - NEO4J_AUTH=neo4j/password
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    networks:
      - neo4j-network

  ollama:
    container_name: ollama
    build:
      context: .
      dockerfile: Ollama/build/Dockerfile
      args:
        OLLAMA_BASE_IMAGE: ${OLLAMA_BASE_IMAGE:-ollama/ollama:latest}
        OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:20b}
    image: logontracer-ollama:${OLLAMA_IMAGE_TAG:-gpt-oss-20b}
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
    networks:
      - neo4j-network

  logontracer:
    container_name: logontracer
    build:
      context: ..
      dockerfile: docker-compose-localllm/LogonTracer/build/Dockerfile
      args:
        FETCH_SIGMA_RULES: ${FETCH_SIGMA_RULES:-true}
        SIGMA_REPO: ${SIGMA_REPO:-https://github.com/SigmaHQ/sigma.git}
    image: logontracer:localllm-offline
    depends_on:
      - neo4j
      - ollama
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      - LTHOSTNAME=neo4j
      - LOGONTRACER_LLM_PROVIDER=ollama
      - LOGONTRACER_OFFLINE=true
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gpt-oss:20b}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-16384}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - LOGONTRACER_MAX_COMPLETION_TOKENS=${LOGONTRACER_MAX_COMPLETION_TOKENS:-4096}
      - LOGONTRACER_FINAL_REPORT_MAX_COMPLETION_TOKENS=${LOGONTRACER_FINAL_REPORT_MAX_COMPLETION_TOKENS:-4096}
      - LOGONTRACER_TEMPERATURE=${LOGONTRACER_TEMPERATURE:-0}
      - LOGONTRACER_AGENT_MAX_ITERATIONS=${LOGONTRACER_AGENT_MAX_ITERATIONS:-6}
      - LOGONTRACER_MAX_UPLOAD_MB=${LOGONTRACER_MAX_UPLOAD_MB:-2048}
      - LOGONTRACER_BROWSER_NEO4J_SERVER=${LOGONTRACER_BROWSER_NEO4J_SERVER:-}
    networks:
      - neo4j-network

networks:
  neo4j-network:
