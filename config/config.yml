settings:
  logontracer:
    WEB_PORT: "8080" # Web application port
    WEB_HOST: "0.0.0.0" # Web application address
    database_name: "data.db" # LogonTracer user info database
    default_user: "neo4j" # LogonTracer default login name
    default_password: "password" # LogonTracer default login password
    default_case: "neo4j" # Default neo4j database name
    SESSION_TIMEOUT_HOURS: 6 # LogonTracer login and Neo4j credential session timeout
    SESSION_COOKIE_SECURE: False # When using HTTPS, it is necessary to relay a web server such as nginx.

  neo4j:
    NEO4J_USER: "neo4j" # neo4j user name
    NEO4J_PASSWORD: "password" # neo4j password
    NEO4J_SERVER: "localhost" # neo4j server
    NEO4J_PORT: "7474" # neo4j listen port
    WS_PORT: "7687" # Websocket port

  elastic:
    ES_SERVER: "localhost:9200" # Elastic Search server
    ES_INDEX: "winlogbeat-*" # Elastic index
    ES_PREFIX: "winlog" # Elastic prefix
    ES_USER: "elastic" # Elastic auth user

  sigma:
    git_url: "https://github.com/SigmaHQ/sigma.git" # Sigma rules url
    results: "sigma_results.json" # Sigma scan result file (JSON format)

  # Rule-based detections (detection.py). Every key is optional; defaults shown.
  detection:
    dcsync_allowlist: '\A(msol_[0-9a-f]+|aad_[0-9a-f]+|sync_.*)\Z' # accounts allowed to replicate (regex)
    kerberoast_threshold: 3       # distinct RC4 service tickets per account...
    kerberoast_window: 300        # ...within N seconds
    spray_threshold: 10           # distinct target accounts per source...
    spray_window: 600             # ...within N seconds
    bruteforce_threshold: 20      # failed logons for one account...
    bruteforce_window: 600        # ...within N seconds
    explicit_creds_threshold: 3   # distinct remote targets with 4648...
    explicit_creds_window: 3600   # ...within N seconds
    reset_after_create_grace: 300 # 4724 this soon after 4720 is the normal creation flow
