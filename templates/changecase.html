<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LogonTracer</title>
  <link rel="stylesheet" href="{{ vendor_asset('/static/vendor/bootstrap/5.3.7/css/bootstrap.min.css', 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="static/css/style.css">
  <link rel="stylesheet" href="static/css/dark-mode.css">
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light p-1 shadow">
    <a class="navbar-brand" href="/"><img class="my_svg" src="static/images/logo_top.svg" alt="top" width="190"></a>
    <div class="collapse navbar-collapse">
    </div>
  </nav>

  <div class="container">
    <div class="row">
      <div class="col-md-4 offset-md-4">
        <div class="login-form bg-light mt-4 p-4">
          <form action="" method="POST" class="row g-3">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <h4>Change Case</h4>

            <div class="col-12">
              <label>Case</label>
              <div id="caseSelect"></div>
            </div>
            <div class="col-12">
              <div class="float-end">
                <button type="submit" class="btn btn-secondary">Submit</button>
                <a href="/" name="cancel" class="btn btn-dark">Cancel</a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script type="text/javascript">
    // Load databases via API
    fetch('/api/neo4j/databases')
      .then(r => r.json())
      .then(cases => {
        var downMenu = '<select class="form-select" name="caseName"><option value="case_name">Case</option>';
        for (var i = 0; i < cases.length; i++) {
          if (cases[i].indexOf("system") == -1) {
            if (cases[i].indexOf("neo4j") != -1) {
              downMenu += '<option value="' + cases[i] + '">default</option>';
            } else {
              downMenu += '<option value="' + cases[i] + '">' + cases[i] + '</option>';
            }
          }
        }
        downMenu += '</select>';
        document.getElementById("caseSelect").innerHTML = downMenu;
      })
      .catch(err => console.log(err));
  </script>
  <!-- Bootstrap JS -->
  <script src="{{ vendor_asset('/static/vendor/bootstrap/5.3.7/js/bootstrap.min.js', 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js') }}"></script>
</body>

</html>
